<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestros productos · Alma Caprina</title>
  <meta name="description" content="Quesos, leche y yogur de cabra hechos a mano por Alma Caprina.">
  <meta name="theme-color" content="#3E4A2F">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="page-head">
    <div class="container">
      <nav id="siteNav"></nav>
      <h1>Nuestros productos</h1>
      <p>Conoce lo que hacemos en la finca: qué es cada producto y qué contiene.</p>
      <a class="btn btn--primary page-head__cta" href="order.html">Realizar pedido</a>
    </div>
  </header>

  <main>
    <section class="values-strip" aria-label="Lo que nos define">
      <ul class="container values-strip__list">
        <li><strong>100% natural</strong><span>Sin conservantes</span></li>
        <li><strong>Artesanal</strong><span>Hecho desde el campo</span></li>
        <li><strong>Consume local</strong><span>Desde Montebello, Antioquia</span></li>
      </ul>
    </section>

    <section class="section">
      <div class="container">
        <nav class="chips category-nav" id="categoryNav" aria-label="Categorías"></nav>
        <div id="catalog" aria-live="polite"><p class="muted">Cargando productos…</p></div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script type="module" src="js/products.js"></script>
